<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai tomodachi</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <audio id="bgm" src="Pokemon Ruby_Sapphire_Emerald- Littleroot Town.mp3" loop autoplay></audio>

  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * {
      box-sizing: border-box;
    }
    
html {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body { 
  background-image: url('img/default.jfif');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  background-color: #212529; 
  font-family: 'Press Start 2P', cursive; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  margin: 0;
  padding: 0;
  position: relative;
  overflow-x: hidden;
}

#bg-overlay {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  image-rendering: pixelated;
  z-index: -1;
  opacity: 0;
  transition: opacity 0.6s steps(6, end);
}
.tamagotchi-screen { 
  width: 380px; 
  text-align: center; 
  padding: 20px;
}

    /* Keeps speech bubble text aligned nicely */
   .nes-balloon {
  width: 100%;
  padding: 10px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: normal;
  line-height: 1.6;
  box-sizing: border-box;
}

#fact-text {
  margin: 0;
}

    .pet-img { 
      width: 96px; 
      height: 96px; 
      cursor: pointer; 
      image-rendering: pixelated; 
      transition: transform 0.1s ease;
      margin-top: 10px;
    }

    /* Fun little bounce animation when tapped */
    .pet-img:active {
      transform: scale(0.9);
    }
/* ============================================
   UNIFORM ICON BUTTON SYSTEM
   All top-right controls (.mute-btn and .retro-btn)
   share this exact look, so any future button just
   needs class="retro-btn" (or .mute-btn, kept as an
   alias below) to match automatically.
   ============================================ */

.top-right-controls {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px; /* Space between the buttons */
}

.retro-btn,
.mute-btn {
  background-color: #000000;
  color: #ff4d4d;
  font-family: 'Press Start 2P', 'Courier New', monospace;
  font-size: 14px;
  width: 44px;
  height: 44px;
  padding: 0;

  /* NES Double Border Style */
  border: 4px solid #ffffff;
  outline: 2px solid #000000;
  box-shadow: 0 0 0 2px #ffffff;
  border-radius: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  image-rendering: pixelated;
  cursor: pointer;
  user-select: none;
  transition: background-color 0.1s ease, transform 0.1s ease;
}

.retro-btn,
.mute-btn {
  background-color: #2e2a26;   /* was #000000 — warm charcoal instead of pure black */
  color: #ffd97d;              /* was #ff4d4d — soft retro gold icon color */
  border: 4px solid #f4e9d8;   /* was #ffffff — warm off-white border */
  outline: 2px solid #2e2a26;  /* was #000000 — match new bg */
  box-shadow: 0 0 0 2px #f4e9d8; /* was #ffffff */
}

.retro-btn:hover,
.mute-btn:hover {
  background-color: #f4e9d8;   /* was #ffffff */
  color: #2e2a26;              /* was #000000 */
}

.retro-btn:active,
.mute-btn:active {
  transform: translateY(2px);
}

.retro-btn svg path,
.mute-btn svg path {
  fill: currentColor;
  stroke: currentColor;
}

.retro-icon {
  display: block;
  shape-rendering: crispedges; /* Preserves sharp lines for pixel aesthetic */
}
.weather-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.weather-modal-box {
  width: 300px;
  text-align: center;
}

/* css time*/
.status-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  font-family: 'Press Start 2P', cursive;
  font-size: clamp(8px, 2.5vw, 10px);
  color: #ffffff;
  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000;
  margin-bottom: 12px;
}

.status-weather {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: clamp(7px, 2vw, 9px);
  opacity: 0.9;
}

#status-weather-icon {
  font-size: clamp(9px, 2.2vw, 11px);
}
.page-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}
  </style>
</head>
<body>
  <div id="bg-overlay"></div>
<div class="page-wrapper">
  <div id="status-bar" class="status-bar">
    <span id="status-time">--:--</span>
    <span id="status-weather" class="status-weather" style="display:none;">
      <span id="status-weather-icon"></span>
      <span id="status-weather-temp"></span>
    </span>
  </div>

  <div class="nes-container is-rounded is-dark tamagotchi-screen">
    <div class="nes-balloon from-left is-dark" style="font-size: 10px; margin-bottom: 15px;">
      <p id="fact-text">Tap Pikachu for a fact!</p>
    </div>

    <img id="pet" class="pet-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/25.gif" alt="Pet">
  </div>
  
<div class="top-right-controls">
  <button id="mute-btn" class="mute-btn" aria-label="Toggle Sound">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 6H5L8 3V13L5 10H2V6Z" fill="#e63946"/>
    <path d="M10 5L13 11M13 5L10 11" stroke="#e63946" stroke-width="1.5" stroke-linecap="square"/>
  </svg>
</button>
  <button id="weather-btn" class="retro-btn" aria-label="Toggle Weather">
   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 48 48" class="weather-icon">
  <title>retro-mode-weather</title>
  <path fill="none" stroke="#ff4d4d" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" d="m33.37 22.117l-9.589 10.912h7.939l-1.247 8.899l9.535-11.778h-8.113zM17.063 5.547v3.751m8.884-.072l-2.653 2.653M8.18 9.226l2.652 2.653M4.5 18.11h3.752m14.158 2.365a5.8 5.8 0 0 0 .502-2.366a5.845 5.845 0 0 0-5.85-5.84a5.843 5.843 0 0 0-5.841 5.84a5.86 5.86 0 0 0 3.674 5.432"/>
  <path fill="none" stroke="#ff4d4d" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" d="M24.925 31.726H13.387a3.89 3.89 0 0 1-3.883-3.883a3.882 3.882 0 0 1 5.286-3.621c.02-.23.052-.46.105-.68a4.895 4.895 0 0 1 4.793-3.904c1.005 0 1.947.303 2.722.837c.356.24.67.523.952.837a6.93 6.93 0 0 1 6.186-3.81c3.16 0 5.82 2.104 6.657 4.982c.712-.387 1.507-.628 2.365-.628a4.934 4.934 0 0 1 4.93 4.94a4.93 4.93 0 0 1-4.766 4.928M13.69 38.465v-1.872m4.087 5.86v-1.871m5.729-.905v-1.871"/>
</svg>
  </button>
  <button id="horoscope-btn" class="retro-btn" aria-label="Toggle Horoscope">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <title>retro-mode-horoscope</title>
    <path fill="none" stroke="#ff4d4d" stroke-width="1.5" d="M12 2v20M2 12h20M12 4a8 8 0 0 1 0 16a8 8 0 0 1 0-16Z"/>
    <circle cx="12" cy="12" r="1.5" fill="#ff4d4d"/>
  </svg>
</button>
</div>
<div id="weather-modal" class="weather-modal" style="display:none;">
  <div class="nes-container is-rounded is-dark weather-modal-box">
    <p style="font-size:10px;">Enter your city:</p>
    <input type="text" id="city-input" class="nes-input" placeholder="e.g. Tokyo" />
    <br><br>
    <button id="city-submit" class="nes-btn is-primary" style="font-size:10px;">Check</button>
    <button id="city-cancel" class="nes-btn" style="font-size:10px;">Cancel</button>
  </div>
</div>
<div id="horoscope-modal" class="weather-modal" style="display:none;">
  <div class="nes-container is-rounded is-dark weather-modal-box">
    <p style="font-size:10px;">Pick your sign:</p>
    <div class="nes-select">
      <select id="zodiac-select">
        <option value="aries">Aries</option>
        <option value="taurus">Taurus</option>
        <option value="gemini">Gemini</option>
        <option value="cancer">Cancer</option>
        <option value="leo">Leo</option>
        <option value="virgo">Virgo</option>
        <option value="libra">Libra</option>
        <option value="scorpio">Scorpio</option>
        <option value="sagittarius">Sagittarius</option>
        <option value="capricorn">Capricorn</option>
        <option value="aquarius">Aquarius</option>
        <option value="pisces">Pisces</option>
      </select>
    </div>
    <br><br>
    <button id="zodiac-submit" class="nes-btn is-primary" style="font-size:10px;">Check</button>
    <button id="zodiac-cancel" class="nes-btn" style="font-size:10px;">Cancel</button>
  </div>
</div>
<div id="scroll-overlay" class="scroll-overlay" style="display:none;">
  <div class="scroll-content">
    <button id="scroll-close" class="scroll-close" aria-label="Close">&times;</button>
    <p id="scroll-sign"></p>
    <p id="scroll-text"></p>
  </div>
</div>
  <script src="app.js"></script>
</body>

</html>
