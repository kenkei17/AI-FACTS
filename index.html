<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tomodachi</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <audio id="bgm" src="Pokemon Ruby_Sapphire_Emerald- Littleroot Town.mp3" loop autoplay></audio>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * {
      box-sizing: border-box;
    }
    
    body { 
      background-color: #212529; 
      font-family: 'Press Start 2P', cursive; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0;
    }
.tamagotchi-screen { 
  width: 380px; 
  text-align: center; 
  padding: 20px;
}

    /* Keeps speech bubble text aligned nicely */
   .nes-balloon {
  width: 100%;
  padding: 10px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: normal;
  line-height: 1.6;
  box-sizing: border-box;
}

#fact-text {
  margin: 0;
}

    .pet-img { 
      width: 96px; 
      height: 96px; 
      cursor: pointer; 
      image-rendering: pixelated; 
      transition: transform 0.1s ease;
      margin-top: 10px;
    }

    /* Fun little bounce animation when tapped */
    .pet-img:active {
      transform: scale(0.9);
    }
   .mute-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  background: #2b2b2f;
  border: 2px solid #ffffff;
  color: #e63946;
  font-size: 20px;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 0;
  box-shadow: 2px 2px 0px rgba(255, 255, 255, 0.15);
  transition: all 0.2s ease-in-out;
}

.mute-btn:hover {
  background: #3a3a40;
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0px rgba(255, 255, 255, 0.2);
}

.mute-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 0px 0px 0px rgba(255, 255, 255, 0.1);
}
  </style>
</head>
<body>

  <div class="nes-container is-rounded is-dark tamagotchi-screen">
    <div class="nes-balloon from-left is-dark" style="font-size: 10px; margin-bottom: 15px;">
      <p id="fact-text">Tap Pikachu for a fact!</p>
    </div>

    <img id="pet" class="pet-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/25.gif" alt="Pet">
  </div>
  <button id="mute-btn" class="mute-btn" aria-label="Toggle Sound">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 6H5L8 3V13L5 10H2V6Z" fill="#e63946"/>
    <path d="M10 5L13 11M13 5L10 11" stroke="#e63946" stroke-width="1.5" stroke-linecap="square"/>
  </svg>
</button>
  <script src="app.js"></script>
</body>
</html>
